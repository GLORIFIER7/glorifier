name: GLORIFIER AI 24/7 Autonomous Development Bot

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: glorifier-autonomous-improvement
  cancel-in-progress: true

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: AI autonomous development cycle
        id: improve
        continue-on-error: true
        env:
          GUARDIAN_PROVIDER: ${{ vars.GUARDIAN_PROVIDER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          META_API_KEY: ${{ secrets.META_API_KEY }}
          META_BASE_URL: ${{ vars.META_BASE_URL }}
          META_MODEL: ${{ vars.META_MODEL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/continuous-improvement-agent.mjs

      - name: Auto-commit verified improvement
        if: steps.improve.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No improvement produced."
            exit 0
          fi
          git config user.name "Glorifier AI Autonomous Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: autonomous Glorifier AI improvement [skip ci]"
          git push origin HEAD:main

      - name: Self-heal failed development cycle
        if: steps.improve.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/self-healing-agent.mjs

      - name: Fail only after self-healing attempt
        if: steps.improve.outcome == 'failure'
        run: exit 1

name: GLORIFIER Infrastructure Health Agent

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: glorifier-infrastructure-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GLORIFIER_HEALTH_URL: ${{ secrets.GLORIFIER_HEALTH_URL }}

    steps:
      - name: Check configured production health endpoint
        id: probe
        if: ${{ env.GLORIFIER_HEALTH_URL != '' }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          status="$(curl -sS -o "$body" -w "%{http_code}" --max-time 15 "$GLORIFIER_HEALTH_URL")"
          echo "status=$status"
          cat "$body"
          test "$status" = "200"
          grep -q '"status":"ok"' "$body"

      - name: Report missing health endpoint
        if: ${{ env.GLORIFIER_HEALTH_URL == '' }}
        run: |
          echo "::warning::GLORIFIER_HEALTH_URL is not configured. Add the public /api/health URL as a repository secret to activate infrastructure probing."

      - name: Open recovery issue on failure
        if: ${{ env.GLORIFIER_HEALTH_URL != '' && failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh issue list --state open --label "ai-recovery" --search "Infrastructure health failure" --json number --jq 'length')"
          if [ "$existing" -gt 0 ]; then
            echo "An open ai-recovery issue already exists; avoiding duplicates."
            exit 0
          fi
          gh issue create             --title "Infrastructure health failure"             --label "ai-recovery"             --body "The scheduled GLORIFIER health probe failed.

Investigate the production /api/health endpoint, recent deployments, logs, and relevant configuration. Do not expose secrets. If a safe code/configuration fix is justified, prepare a small PR for review. Do not deploy directly.

Triggered by: ${{ github.workflow }} run ${{ github.run_id }}"

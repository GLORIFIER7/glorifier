name: Glorifier AI Autonomous Improvement

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "AI provider to use for this run"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - openai
          - gemini
  push:
    branches:
      - main
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

concurrency:
  group: glorifier-autonomous-improvement
  cancel-in-progress: true

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Autonomous improvement agent
        env:
          GUARDIAN_PROVIDER: ${{ github.event.inputs.provider != '' && github.event.inputs.provider != 'auto' && github.event.inputs.provider || vars.GUARDIAN_PROVIDER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/continuous-improvement-agent.mjs

      - name: Commit verified improvement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No improvement produced."
            exit 0
          fi
          git config user.name "Glorifier AI Autonomous Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: autonomous Glorifier AI improvement [skip ci]"
          git push origin HEAD:main

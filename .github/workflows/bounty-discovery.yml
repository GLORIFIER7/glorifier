name: GLORIFIER Bounty Opportunity Discovery

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Record discovery policy
        run: |
          echo "DISCOVER -> VERIFY FUNDING -> VERIFY ELIGIBILITY -> CLAIM -> SOLVE -> PR/REPORT -> ACCEPTANCE -> VERIFY PAYOUT -> SETTLE"
          echo "No advertised bounty is revenue until canonical payment evidence exists."
      - name: Install dependencies
        run: npm ci
      - name: Run governed opportunity discovery
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/run-opportunity-discovery.ts

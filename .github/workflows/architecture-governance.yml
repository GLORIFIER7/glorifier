name: Architecture Governance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'server.ts'
      - 'config/**'
      - 'docs/**'
      - '.github/workflows/architecture-governance.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'server.ts'
      - 'config/**'
      - 'docs/**'
      - '.github/workflows/architecture-governance.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Validate architecture policy JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('config/glorifier-service-ownership.json','utf8')); JSON.parse(require('fs').readFileSync('config/glorifier-capabilities.json','utf8')); console.log('Architecture policy JSON valid')"
      - name: Typecheck
        run: bun run lint
      - name: Build
        run: bun run build
